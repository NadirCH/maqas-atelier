<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Double Concentric Circle for Sanctuary & Privacy -->
  <circle cx="60" cy="60" r="54" stroke="#5E548E" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
  <circle cx="60" cy="60" r="49" stroke="#E0B1CB" stroke-width="2"/>
  <circle cx="60" cy="60" r="45" stroke="#5E548E" stroke-width="1" opacity="0.4"/>

  <!-- Mannequin / Dressmaker Form Silhouette -->
  <!-- Neck / Top finial -->
  <circle cx="60" cy="28" r="3.5" fill="#E0B1CB"/>
  <path d="M58 31.5 H62 V36 H58 Z" fill="#5E548E"/>
  
  <!-- Shoulders and Torso -->
  <path d="M48 39 C51 36, 69 36, 72 39 C73.5 44, 71 50, 68 56 C66 60, 65 65, 69 72 C71 75.5, 68 77, 60 77 C52 77, 49 75.5, 51 72 C55 65, 54 60, 52 56 C49 50, 46.5 44, 48 39 Z" 
        fill="url(#goldGradient)" stroke="#231942" stroke-width="1.2"/>

  <!-- Mannequin Stand -->
  <line x1="60" y1="77" x2="60" y2="92" stroke="#5E548E" stroke-width="2" stroke-linecap="round"/>
  <path d="M51 92 H69 M54 92 L50 96 M66 92 L70 96" stroke="#5E548E" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Sewing Needle (Fine diagonal angle) -->
  <g transform="rotate(-25 60 55)">
    <line x1="60" y1="20" x2="60" y2="86" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="60" cy="24" rx="0.8" ry="2.2" fill="#231942"/>
  </g>

  <!-- Flowing Thread Loop (Mauve & Gold) -->
  <path d="M56 26 C40 28, 38 48, 54 52 C70 56, 76 66, 62 76 C52 83, 44 76, 42 68" 
        stroke="#E0B1CB" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  
  <!-- Subtle Sparkles -->
  <path d="M78 34 L80 30 L82 34 L86 36 L82 38 L80 42 L78 38 L74 36 Z" fill="#E0B1CB" opacity="0.85"/>
  <path d="M38 72 L39.5 69 L41 72 L44 73.5 L41 75 L39.5 78 L38 75 L35 73.5 Z" fill="#E0B1CB" opacity="0.7"/>

  <defs>
    <linearGradient id="goldGradient" x1="48" y1="36" x2="72" y2="77" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#E0B1CB" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
</svg>